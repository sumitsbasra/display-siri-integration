<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0">
  <title>Iris</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      width: 600px;
      height: 600px;
    }
    .screen.hidden { display: none; }

    /* ── Header ── */
    .header {
      flex-shrink: 0;
      padding: 20px 26px 14px;
      border-bottom: 1px solid #111;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #a78bfa;
    }
    .header .status {
      margin-top: 5px;
      font-size: 12px;
      color: #444;
    }

    /* ── Content ── */
    .content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Nav ── */
    .nav {
      flex-shrink: 0;
      padding: 10px 16px;
      border-top: 1px solid #111;
      display: flex;
      gap: 8px;
    }

    /* ── Focusable ── */
    .focusable {
      outline: none;
      flex: 1;
      padding: 13px 16px;
      background: #0a0a0a;
      border: 2px solid #1c1c1c;
      border-radius: 10px;
      color: #555;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.12s, box-shadow 0.12s, color 0.12s, background 0.12s;
    }
    .focusable:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.3);
      color: #c4b5fd;
      background: #0d071e;
    }
    .focusable.primary { border-color: #3b1f6e; color: #a78bfa; background: #080514; }
    .focusable.primary:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 22px rgba(124, 58, 237, 0.45);
      color: #ddd6fe;
      background: #160b30;
    }

    /* ── Orb ── */
    .orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
    .orb {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 2px solid #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .orb.listening { border-color: #ef4444; animation: pulse-red 1s ease-in-out infinite; }
    .orb.thinking  { border-color: #7c3aed; animation: pulse-purple 1.5s ease-in-out infinite; }
    @keyframes pulse-red {
      0%,100% { box-shadow: 0 0 20px rgba(239,68,68,0.2); }
      50%      { box-shadow: 0 0 50px rgba(239,68,68,0.55), 0 0 0 10px rgba(239,68,68,0.07); }
    }
    @keyframes pulse-purple {
      0%,100% { box-shadow: 0 0 20px rgba(124,58,237,0.2); }
      50%      { box-shadow: 0 0 50px rgba(124,58,237,0.5), 0 0 0 10px rgba(124,58,237,0.07); }
    }
    .orb svg { width: 46px; height: 46px; }
    .orb-hint { font-size: 14px; color: #333; }
    .transcript {
      font-size: 17px;
      color: #7c3aed;
      text-align: center;
      line-height: 1.5;
      min-height: 52px;
      max-width: 480px;
      transition: color 0.2s;
    }
    .transcript.final { color: #a78bfa; }

    /* ── Response ── */
    .response-scroll { width: 100%; height: 100%; overflow-y: auto; scrollbar-width: none; }
    .response-scroll::-webkit-scrollbar { display: none; }
    .response-text { font-size: 18px; line-height: 1.7; color: #e2e8f0; white-space: pre-wrap; word-break: break-word; }

    /* ── Settings ── */
    .settings-list { width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #333;
      margin-bottom: 7px;
    }
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      background: #070707;
      border: 2px solid #1c1c1c;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      line-height: 1.6;
      outline: none;
      resize: none;
      font-family: inherit;
      transition: border-color 0.12s;
    }
    .field textarea:focus { border-color: #7c3aed; }
    .field textarea::placeholder { color: #222; }
    .field-hint { font-size: 12px; color: #2a2a2a; margin-top: 5px; line-height: 1.4; }
  </style>
</head>
<body>

<!-- ── HOME ── -->
<div id="screen-home" class="screen">
  <div class="header">
    <h1>IRIS</h1>
    <div id="status-text" class="status">Ready</div>
  </div>
  <div class="content">
    <div class="orb-wrap">
      <div id="orb" class="orb">
        <svg viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="16" y="6" width="14" height="20" rx="7" stroke="#2a2a2a" stroke-width="2.2"/>
          <path d="M8 23c0 8.284 6.716 15 15 15s15-6.716 15-15" stroke="#2a2a2a" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="23" y1="38" x2="23" y2="44" stroke="#2a2a2a" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="15" y1="44" x2="31" y2="44" stroke="#2a2a2a" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="orb-hint" class="orb-hint">Press Enter to talk</div>
      <div id="transcript" class="transcript"></div>
    </div>
  </div>
  <div class="nav">
    <button id="btn-talk" class="focusable primary" style="flex:2">Talk</button>
    <button id="btn-settings" class="focusable">Settings</button>
  </div>
</div>

<!-- ── RESPONSE ── -->
<div id="screen-response" class="screen hidden">
  <div class="header">
    <h1>IRIS</h1>
    <div class="status" style="color:#6d28d9">Response</div>
  </div>
  <div class="content" style="align-items:flex-start; justify-content:flex-start; padding-top:16px;">
    <div id="response-scroll" class="response-scroll">
      <div id="response-text" class="response-text"></div>
    </div>
  </div>
  <div class="nav">
    <button id="btn-back" class="focusable primary">Back</button>
    <button id="btn-talk-again" class="focusable">Talk again</button>
  </div>
</div>

<!-- ── SETTINGS ── -->
<div id="screen-settings" class="screen hidden">
  <div class="header">
    <h1>SETTINGS</h1>
    <div class="status">Your context for Iris</div>
  </div>
  <div class="content" style="align-items:flex-start; justify-content:flex-start;">
    <div class="settings-list">
      <div class="field">
        <label>About you</label>
        <textarea id="s-context" rows="7"
          placeholder="I'm a software engineer in San Francisco. My work calendar is called 'Work'. I have a weekly standup on Tuesdays at 10am. I prefer short, direct answers."
        ></textarea>
        <div class="field-hint">Included with every query — your name, job, preferences, anything useful.</div>
      </div>
    </div>
  </div>
  <div class="nav">
    <button id="btn-save" class="focusable primary" style="flex:2">Save</button>
    <button id="btn-cancel" class="focusable">Cancel</button>
  </div>
</div>

<script>
'use strict';

// ── Persisted config ──────────────────────────────────────────────────────────
const cfg = {
  get context()   { return localStorage.getItem('iris.context') || ''; },
  set context(v)  { localStorage.setItem('iris.context', v); },
};

// ── State ─────────────────────────────────────────────────────────────────────
let recognition = null;
let listening = false;
let currentScreen = 'home';
let pendingTranscript = '';

// ── Screens ───────────────────────────────────────────────────────────────────
function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById('screen-' + name).classList.remove('hidden');
  currentScreen = name;
  document.querySelector('#screen-' + name + ' .focusable')?.focus();
}

// ── D-pad navigation ──────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (currentScreen === 'response' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const navBtns = [...document.querySelectorAll('#screen-response .focusable')];
    if (!navBtns.includes(document.activeElement)) {
      document.getElementById('response-scroll')
        .scrollBy({ top: e.key === 'ArrowDown' ? 90 : -90, behavior: 'smooth' });
      e.preventDefault();
      return;
    }
  }

  const screen = document.getElementById('screen-' + currentScreen);
  const focusables = [...screen.querySelectorAll('.focusable')];
  const idx = focusables.indexOf(document.activeElement);

  switch (e.key) {
    case 'ArrowDown': case 'ArrowRight':
      e.preventDefault();
      focusables[(idx + 1) % focusables.length]?.focus();
      break;
    case 'ArrowUp': case 'ArrowLeft':
      e.preventDefault();
      focusables[(idx - 1 + focusables.length) % focusables.length]?.focus();
      break;
    case 'Enter':
      e.preventDefault();
      if (focusables.includes(document.activeElement)) document.activeElement.click();
      break;
  }
});

// ── Orb helpers ───────────────────────────────────────────────────────────────
function setOrb(state) {
  document.getElementById('orb').className = 'orb' + (state !== 'idle' ? ' ' + state : '');
}
function setHint(t)   { document.getElementById('orb-hint').textContent = t; }
function setStatus(t) { document.getElementById('status-text').textContent = t; }

function setTranscript(t, isFinal) {
  const el = document.getElementById('transcript');
  el.textContent = t;
  el.className = 'transcript' + (isFinal ? ' final' : '');
}

// ── API call ──────────────────────────────────────────────────────────────────
async function sendQuery(query) {
  setOrb('thinking');
  setHint('Thinking…');
  setStatus('Asking Iris…');

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        userContext: cfg.context,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      }),
    });

    const data = await res.json();

    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    setOrb('idle');
    setHint('Press Enter to talk');
    setTranscript('');
    setStatus('Ready');
    document.getElementById('response-text').textContent = data.response;
    document.getElementById('response-scroll').scrollTop = 0;
    show('response');

  } catch (err) {
    setOrb('idle');
    setHint('Error — try again');
    setStatus(err.message.slice(0, 60));
    console.error(err);
  }
}

// ── Voice (Web Speech API) ────────────────────────────────────────────────────
function startListening() {
  if (listening) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setHint('Speech not available on this browser'); return; }

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = false;
  listening = true;
  pendingTranscript = '';

  recognition.onstart  = () => { setOrb('listening'); setHint('Listening…'); setTranscript(''); };
  recognition.onerror  = e  => { listening = false; setOrb('idle'); setHint('Mic error: ' + e.error); };

  recognition.onresult = ({ resultIndex, results }) => {
    let interim = '', final = '';
    for (let i = resultIndex; i < results.length; i++) {
      const t = results[i][0].transcript;
      results[i].isFinal ? (final += t) : (interim += t);
    }
    pendingTranscript = final || interim;
    setTranscript(pendingTranscript, !!final);
  };

  recognition.onend = () => {
    listening = false;
    recognition = null;
    const query = pendingTranscript.trim();
    if (query) sendQuery(query);
    else { setOrb('idle'); setHint('Press Enter to talk'); }
  };

  recognition.start();
}

function stopListening() { recognition?.stop(); }

// ── Buttons ───────────────────────────────────────────────────────────────────
document.getElementById('btn-talk').onclick       = () => listening ? stopListening() : startListening();
document.getElementById('btn-settings').onclick   = () => { document.getElementById('s-context').value = cfg.context; show('settings'); };
document.getElementById('btn-back').onclick       = () => show('home');
document.getElementById('btn-talk-again').onclick  = () => { show('home'); startListening(); };
document.getElementById('btn-save').onclick       = () => { cfg.context = document.getElementById('s-context').value.trim(); show('home'); };
document.getElementById('btn-cancel').onclick     = () => show('home');
</script>
</body>
</html>
